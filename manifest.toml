#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "openlmnp"
name = "OpenLMNP"
description.en = "Accounting and tax return for furnished rentals taxed in France: depreciation, 2031/2033 forms, FEC export"
description.fr = "Comptabilité et liasse fiscale du loueur en meublé au régime réel : amortissements, 2031/2033, export FEC"

version = "1.6.5~ynh1"

maintainers = ["manganate006"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://openlmnp.fr"
demo = "https://app.openlmnp.fr"
admindoc = "https://github.com/manganate006/openlmnp/blob/main/docs/INSTALLATION.md"
code = "https://github.com/manganate006/openlmnp"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

# L'application a son propre écran de connexion et sa propre table de comptes : elle ne
# lit pas l'annuaire LDAP de YunoHost et ne connecte personne automatiquement.
ldap = false
sso = false

# Le gros du disque, ce sont les dépendances PHP (vendor/) et les justificatifs déposés.
disk = "500M"
# La compilation des assets (Vite) est le pic de mémoire de l'installation.
ram.build = "1G"
ram.runtime = "150M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/openlmnp"

    [install.init_main_permission]
    help.en = "OpenLMNP has its own login screen. Keep 'visitors' unless you also want the YunoHost portal to gate the app — in that case you will log in twice."
    help.fr = "OpenLMNP a son propre écran de connexion. Laissez « visiteurs » sauf si vous voulez que le portail YunoHost filtre aussi l'accès — vous vous connecterez alors deux fois."
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    help.en = "The account is created during the installation, using the e-mail address of the YunoHost user chosen above. Public sign-up stays closed."
    help.fr = "Le compte est créé pendant l'installation, avec l'adresse e-mail de l'utilisateur YunoHost choisi ci-dessus. L'inscription publique reste fermée."
    type = "password"

    [install.telemetry]
    ask.en = "Report this installation to the developer?"
    ask.fr = "Signaler cette installation au développeur ?"
    help.en = "Once a day, a random identifier and the version number, so that the project knows how many instances exist. No accounting, personal or tax data. Can be changed later in .env."
    help.fr = "Une fois par jour, un identifiant aléatoire et le numéro de version, pour que le projet sache combien d'instances existent. Aucune donnée comptable, personnelle ou fiscale. Modifiable ensuite dans .env."
    type = "boolean"
    default = false

[resources]

    [resources.sources]

        [resources.sources.main]
        url = "https://github.com/manganate006/openlmnp/releases/download/v1.6.5/openlmnp-1.6.5.tar.gz"
        sha256 = "cfa78cd8bb7730139b2ce95de467b82e07c26d89f0b5a227e1159497738273d2"
        autoupdate.strategy = "latest_github_release"
        autoupdate.asset = "^openlmnp-.*\\.tar\\.gz$"

    [resources.system_user]
    # Password reset links are sent through the server's own postfix.
    allow_email = true

    [resources.install_dir]
    # NGINX serves public/ directly through an alias and has to be able to read it.
    group = "www-data:r-x"

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = [
        "sqlite3",
        "php8.4-fpm",
        "php8.4-cli",
        "php8.4-bcmath",
        "php8.4-curl",
        "php8.4-gd",
        "php8.4-intl",
        "php8.4-mbstring",
        "php8.4-opcache",
        "php8.4-sqlite3",
        "php8.4-xml",
        "php8.4-zip",
    ]

    [resources.composer]
    version = "2.8.12"

    [resources.nodejs]
    version = "22"
