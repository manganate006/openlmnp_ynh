#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

  alias __INSTALL_DIR__/public/;

  index index.php;

  # Uploaded receipts are scanned invoices; php_upload_max_filesize is set to match.
  client_max_body_size 50M;

  # The fallback is a named location, not a file. Inside a location that uses alias,
  # a file fallback is resolved against the *server* root instead: a root install would
  # look for "/usr/share/nginx/html" + "index.php" and answer 404 on every page.
  try_files $uri $uri/ @__APP__;

  # Before the PHP block: NGINX picks the first matching regex location, so .env or a
  # stray .php dotfile would otherwise be handed to FPM instead of being refused.
  location ~ /\.(?!well-known) {
    deny all;
  }

  location ~ [^/]\.php(/|$) {
    fastcgi_pass unix:/var/run/php/php__PHP_VERSION__-fpm-__APP__.sock;
    # Shipped by the core since 12.1.38 (see the manifest's yunohost requirement). Defines
    # SCRIPT_FILENAME, PATH_INFO and the rest; the _no_auth variant deliberately leaves
    # REMOTE_USER unset, which is what an app with its own login screen needs.
    include fastcgi_params_no_auth;
    # Generating the tax return PDF takes longer than the default 60s on a small server.
    fastcgi_read_timeout 300;
  }
}

# Named after the app rather than a fixed string: two instances on the same server would
# otherwise declare the same named location twice.
location @__APP__ {
  rewrite ^ __PATH__/index.php last;
}
